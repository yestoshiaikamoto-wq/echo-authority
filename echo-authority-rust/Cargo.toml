[package]
name = "echo-authority-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A reference implementation of the Echo Authority Protocol, Draft 0.1 — deterministic Border Control + attenuation."
license = "MIT OR Apache-2.0"
authors = ["Money Musk <echo@moneymusk.space>"]
repository = "https://github.com/yestoshiaikamoto-wq/echo-authority"
homepage = "https://moneymusk.space/protocol"
documentation = "https://docs.rs/echo-authority-core"
readme = "README.md"
keywords = ["authority", "authorization", "capability", "agent", "ed25519"]
categories = ["authentication", "cryptography", "command-line-utilities"]
exclude = ["target/"]

[lib]
name = "echo_authority_core"
path = "src/lib.rs"

[[bin]]
name = "echo-border-control"
path = "src/bin/echo-border-control.rs"

[[bin]]
name = "dump-vectors"
path = "src/bin/dump-vectors.rs"

[[bin]]
name = "echo-authority-cli"
path = "src/bin/echo-authority-cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"

[dev-dependencies]
# ed25519-dalek's Signer trait is used directly in tests; no extra deps needed.
