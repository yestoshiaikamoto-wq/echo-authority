name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both crates to crates.io after verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # The WASM crate depends on the published version of core.
      - name: Publish echo-authority-core
        run: cargo publish --locked --manifest-path echo-authority-rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for the registry index to catch up
        run: sleep 45

      - name: Publish echo-authority-wasm
        run: cargo publish --locked --manifest-path echo-authority-wasm/Cargo.toml --target wasm32-unknown-unknown
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
